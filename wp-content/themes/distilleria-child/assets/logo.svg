  </g>
  
  <!-- Typography -->
  <text x="78" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" letter-spacing="2.5" fill="#1a1918">DISTILLERIA</text>
  <text x="272" y="38" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="24" font-weight="700" letter-spacing="2" fill="url(#goldGrad)">AFTERBIT</text>
  
  <line x1="78" y1="46" x2="385" y2="46" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.8" />
  
  <text x="78" y="60" font-family="'Montserrat', 'Helvetica Neue', sans-serif" font-size="9" font-weight="600" letter-spacing="3.5" fill="#8b5a2b">LIQUORIFICIO &amp; SPIRITS ARTIGIANALI</text>
</svg>
